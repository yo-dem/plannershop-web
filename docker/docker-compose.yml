# PlannerShop — full stack.
#
# Development (database only; backend from IntelliJ, frontend with ng serve):
#   docker compose up -d postgres
#
# Full stack in containers (deployment test):
#   docker compose up -d --build        →  http://localhost:${APP_PORT:-8090}
#
# Reset a user's password (prints a temporary password):
#   docker compose run --rm backend --app.reset-password=user@email
#
# Variables are read from the .env file in this folder (see .env.example).
# The defaults are meant ONLY for local development.

name: plannershop

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plannershop}
      POSTGRES_USER: ${POSTGRES_USER:-plannershop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plannershop}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Localhost only: used by the backend started from IntelliJ and by DBeaver.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-plannershop}
      DB_USER: ${POSTGRES_USER:-plannershop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-plannershop}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_MODE: ${APP_MODE:-cloud}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@plannershop.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Platform administrator}
      ACTIVITY_NAME: ${ACTIVITY_NAME:-My business}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@plannershop.local}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Rome}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  pgdata:
