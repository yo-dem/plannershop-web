# PlannerShop — stack completo.
#
# Sviluppo (solo database; backend da IntelliJ, frontend con ng serve):
#   docker compose up -d postgres
#
# Stack completo nei container (test di deploy):
#   docker compose up -d --build        →  http://localhost:${APP_PORT:-8090}
#
# Ripristino della password di un utente (stampa una password provvisoria):
#   docker compose run --rm backend --app.reset-password=email@utente
#
# Le variabili si leggono dal file .env in questa cartella (vedi .env.example).
# I default valgono SOLO per lo sviluppo locale.

name: plannershop

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plannershop}
      POSTGRES_USER: ${POSTGRES_USER:-plannershop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plannershop}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Solo su localhost: serve al backend avviato da IntelliJ e a DBeaver.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-plannershop}
      DB_USER: ${POSTGRES_USER:-plannershop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-plannershop}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_MODALITA: ${APP_MODALITA:-cloud}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@plannershop.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      ATTIVITA_NOME: ${ATTIVITA_NOME:-La mia attività}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@plannershop.local}
      ADMIN_NOME: ${ADMIN_NOME:-Amministratore}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Rome}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  pgdata:
