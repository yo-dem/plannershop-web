# If another HTTPS proxy sits in front (Caddy, Traefik...) we keep its
# X-Forwarded-Proto; otherwise we use the protocol of the request.
# The backend needs it to mark the session cookie as Secure over HTTPS.
map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploads (e.g. email flyer) up to 10 MB.
    client_max_body_size 10m;

    # API: forwarded to the backend container.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $original_proto;
    }

    # Files with a hash in the name: long cache.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single Page Application: every other route returns index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
