<p-toast position="top-center" />
<p-confirmdialog />

@if (auth.utente(); as utente) {
  <header class="topbar">
    <a routerLink="/" class="brand">
      <i class="pi pi-calendar" aria-hidden="true"></i>
      <span>PlannerShop</span>
    </a>
    @if (utente.tenant) {
      <span class="tenant">{{ utente.tenant.nome }}</span>
    }

    <nav class="nav">
      @for (v of voci(); track v.link) {
        <a [routerLink]="v.link" routerLinkActive="attiva" [routerLinkActiveOptions]="{ exact: v.link === '/' }">
          <i [class]="v.icon" aria-hidden="true"></i>
          <span>{{ v.label }}</span>
        </a>
      }
    </nav>

    @if (numeroCompleanni(); as n) {
      <a routerLink="/clienti/compleanni" class="compleanni"
         [attr.aria-label]="n + (n === 1 ? ' compleanno' : ' compleanni') + ' questo mese'"
         [title]="n + (n === 1 ? ' compleanno' : ' compleanni') + ' questo mese'">
        <i class="pi pi-gift" aria-hidden="true"></i>
        <span class="conteggio">{{ n }}</span>
      </a>
    }

    <p-button
      [label]="utente.nome"
      icon="pi pi-user"
      [text]="true"
      severity="contrast"
      styleClass="utente"
      (onClick)="menu.toggle($event)"
    />
    <p-menu #menu [model]="menuUtente" [popup]="true" appendTo="body" />
  </header>
}

<main class="content">
  <router-outlet />
</main>
