@if (auth.user(); as user) {
  <header class="topbar">
    <a routerLink="/" class="brand">
      <mat-icon aria-hidden="true">calendar_month</mat-icon>
      <span>PlannerShop</span>
    </a>
    @if (user.tenant) {
      <span class="tenant">{{ user.tenant.name }}</span>
    }

    <nav class="nav">
      @for (item of navItems(); track item.link) {
        <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.link === '/' }">
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (birthdayCount(); as n) {
      <a routerLink="/customers/birthdays" class="birthdays" [attr.aria-label]="birthdayText()" [matTooltip]="birthdayText()">
        <mat-icon aria-hidden="true">redeem</mat-icon>
        <span class="count">{{ n }}</span>
      </a>
    }

    <button matButton class="user-menu" [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ user.name }}</span>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
      <a mat-menu-item routerLink="/change-password">
        <mat-icon>key</mat-icon>
        <span i18n="@@nav.changePassword">Change password</span>
      </a>
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        <span i18n="@@nav.signOut">Sign out</span>
      </button>
    </mat-menu>
  </header>
}

<main class="content">
  <router-outlet />
</main>
