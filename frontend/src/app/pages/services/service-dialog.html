<h2 mat-dialog-title>
  @if (id === null) {
    <ng-container i18n="@@services.newTitle">New service</ng-container>
  } @else {
    <ng-container i18n="@@services.editTitle">Edit service</ng-container>
  }
</h2>

<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <mat-dialog-content>
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" class="loading-bar" />
    }
    @if (error(); as e) {
      <app-notice type="error">{{ e }}</app-notice>
    }

    <div class="form" [class.loading-dim]="loading()">
      <mat-form-field>
        <mat-label i18n="@@services.name">Name</mat-label>
        <input matInput id="name" formControlName="name" autocomplete="off" required />
        <mat-error>{{ message('name') }}</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label i18n="@@common.description">Description</mat-label>
        <input matInput id="description" formControlName="description" autocomplete="off" required />
        <mat-error>{{ message('description') }}</mat-error>
      </mat-form-field>

      <app-price-fields [group]="form.controls.prices" [serverErrors]="serverErrors()" />

      <mat-form-field>
        <mat-label i18n="@@common.notes">Notes</mat-label>
        <textarea matInput id="notes" formControlName="notes" rows="3"></textarea>
        <mat-error>{{ message('notes') }}</mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    @if (id !== null) {
      <button matButton type="button" class="delete-button" (click)="delete()" [disabled]="loading()">
        <mat-icon>delete</mat-icon> <ng-container i18n="@@common.delete">Delete</ng-container>
      </button>
    }
    <span class="spacer"></span>
    <button matButton type="button" mat-dialog-close i18n="@@common.cancel">Cancel</button>
    <button matButton="filled" type="submit" [disabled]="loading() || sending()">
      <mat-icon>check</mat-icon> <ng-container i18n="@@common.save">Save</ng-container>
    </button>
  </mat-dialog-actions>
</form>
