<h2 mat-dialog-title>{{ id === null ? 'Nuovo servizio' : 'Modifica servizio' }}</h2>

<form [formGroup]="form" (ngSubmit)="salva()" novalidate>
  <mat-dialog-content>
    @if (caricamento()) {
      <mat-progress-bar mode="indeterminate" class="caricamento" />
    }
    @if (errore(); as e) {
      <app-avviso tipo="errore">{{ e }}</app-avviso>
    }

    <div class="modulo" [class.in-caricamento]="caricamento()">
      <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput id="nome" formControlName="nome" autocomplete="off" required />
        <mat-error>{{ messaggio('nome') }}</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Descrizione</mat-label>
        <input matInput id="descrizione" formControlName="descrizione" autocomplete="off" required />
        <mat-error>{{ messaggio('descrizione') }}</mat-error>
      </mat-form-field>

      <app-campi-prezzo [gruppo]="form.controls.prezzi" [erroriServer]="erroriServer()" />

      <mat-form-field>
        <mat-label>Note</mat-label>
        <textarea matInput id="note" formControlName="note" rows="3"></textarea>
        <mat-error>{{ messaggio('note') }}</mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    @if (id !== null) {
      <button matButton type="button" class="elimina" (click)="elimina()" [disabled]="caricamento()">
        <mat-icon>delete</mat-icon> Elimina
      </button>
    }
    <span class="spazio"></span>
    <button matButton type="button" mat-dialog-close>Annulla</button>
    <button matButton="filled" type="submit" [disabled]="caricamento() || invio()">
      <mat-icon>check</mat-icon> Salva
    </button>
  </mat-dialog-actions>
</form>
