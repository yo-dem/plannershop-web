# Messages shown to the user by the backend (API errors, validation).
# English is the default; translations are in messages_<language>.properties.
# The language is chosen from the Accept-Language header of the request.

# --- validation (used by the @NotBlank, @Size, ... annotations as {validation.xxx})
validation.required=Required
validation.email=Invalid email
validation.maxLength=At most {max} characters
validation.passwordLength=The password must have at least {min} characters
validation.birthday=Enter both day and month, with an existing date
validation.day=Invalid day
validation.month=Invalid month
validation.notNegative=Cannot be negative
validation.quantityTooLarge=Quantity too large
validation.vatRate=Invalid VAT rate
validation.twoDecimals=At most two decimals
validation.amount=Invalid amount
validation.price=Enter the price
validation.priceBase=Specify which price you entered
validation.iban=Invalid IBAN

# --- generic errors
error.validation=Invalid data
error.conflict=Meanwhile another user changed this data. Reload and try again.
error.versionMissing=Missing version
error.invalidMonth=Invalid month
error.notFound.customer=Customer not found
error.notFound.product=Product not found
error.notFound.service=Service not found
error.notFound.supplier=Supplier not found
error.notFound.tenant=Business not found
error.notFound.userWithEmail=No user with email {0}

# --- authentication
auth.invalidCredentials=Wrong email or password
auth.noAccessToTenant=You have no access to this business
auth.noActiveTenant=Your user is not linked to any active business
auth.sessionExpired=Session expired
auth.sessionRevoked=Session no longer valid, please sign in again
auth.userInactive=User no longer active
auth.noLongerAccess=You no longer have access to this business
auth.userNotFound=User not found
auth.currentPasswordWrong=The current password is not correct
auth.newPasswordSame=The new password must be different from the current one
auth.tooManyAttempts=Too many sign-in attempts. Try again in a few minutes.
auth.loginRequired=Sign-in required

# --- platform
platform.adminPasswordRequired=Enter a temporary password for the new administrator
