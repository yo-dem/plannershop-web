# Configurazione del backend.
# I valori ${VAR:default} si leggono da variabili d'ambiente: i default valgono
# per lo sviluppo locale (Postgres avviato con docker compose), in produzione
# vanno sempre impostati tramite il file docker/.env.

spring:
  application:
    name: plannershop

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plannershop}
    username: ${DB_USER:plannershop}
    password: ${DB_PASSWORD:plannershop}

  jpa:
    # Lo schema lo gestisce SOLO Flyway: Hibernate si limita a verificare
    # che le entità corrispondano alle tabelle.
    hibernate:
      ddl-auto: validate
    # Evita query "nascoste" durante il rendering della risposta HTTP.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  # Dietro nginx: rispetta gli header X-Forwarded-* (protocollo, host).
  forward-headers-strategy: framework
  error:
    include-message: always

# Actuator: espone solo lo stato di salute (usato dall'healthcheck Docker).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Documentazione API sotto /api, così passa dallo stesso proxy del frontend.
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

# Impostazioni dell'applicazione (vedi SecurityProperties).
app:
  security:
    # Segreto per firmare i token. In produzione: stringa casuale lunga (≥ 32 caratteri).
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    login-max-tentativi: 10
    login-finestra: 15m
  bootstrap:
    # Creato al primo avvio se non esistono utenti.
    superadmin-email: ${SUPERADMIN_EMAIL:admin@plannershop.local}
    # Se vuota viene generata e scritta nel log.
    superadmin-password: ${SUPERADMIN_PASSWORD:}
