# Backend configuration.
# ${VAR:default} values are read from environment variables: the defaults are
# meant for local development (Postgres started with docker compose); in
# production always set them through the docker/.env file.

spring:
  application:
    name: plannershop

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plannershop}
    username: ${DB_USER:plannershop}
    password: ${DB_PASSWORD:plannershop}

  jpa:
    # The schema is managed ONLY by Flyway: Hibernate just validates that the
    # entities match the tables.
    hibernate:
      ddl-auto: validate
    # Avoid "hidden" queries while the HTTP response is being rendered.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  # Messages shown to the user (messages.properties = English, messages_it = Italian).
  # The language comes from the Accept-Language header; without a translation,
  # English is used (never the language of the server).
  messages:
    basename: messages
    fallback-to-system-locale: false

  # API pagination (?page=&size=&sort=): at most 100 items per page.
  data:
    web:
      pageable:
        max-page-size: 100

server:
  # Behind nginx: honour the X-Forwarded-* headers (protocol, host).
  forward-headers-strategy: framework
  error:
    include-message: always

# Actuator: exposes only the health status (used by the Docker healthcheck).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# API documentation under /api, so it goes through the same proxy as the frontend.
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

# Application settings (see AppProperties, SecurityProperties, BootstrapProperties).
app:
  # cloud = platform with many businesses managed by the SUPERADMIN
  # local = installed on the PC of a single business, without SUPERADMIN
  mode: ${APP_MODE:cloud}
  security:
    # Secret used to sign the tokens. In production: a long random string (≥ 32 characters).
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    login-max-attempts: 10
    login-window: 15m
  bootstrap:
    # Users created on first start-up, only if the database has no users.
    # Empty passwords are generated and written to the log.
    # Cloud mode: the SUPERADMIN.
    superadmin-email: ${SUPERADMIN_EMAIL:admin@plannershop.local}
    superadmin-password: ${SUPERADMIN_PASSWORD:}
    superadmin-name: ${SUPERADMIN_NAME:Platform administrator}
    # Local mode: the single business and its ADMIN (password always temporary).
    tenant-name: ${ACTIVITY_NAME:My business}
    admin-email: ${ADMIN_EMAIL:admin@plannershop.local}
    admin-name: ${ADMIN_NAME:Administrator}
    admin-password: ${ADMIN_PASSWORD:}
